[package]
name = "tj-core"
description = "tinyjump core: language, VM and I/O-free runtime shared by every host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Calendar arithmetic for `Time` (vm/time.rs): the calendar only, about 5 KB on devices.
# Showing and picking times is the host's job, with the platform's own formatter.
time = { version = "0.3", default-features = false }
# CSS flexbox layout for native hosts; the browser does the same layout natively.
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "taffy_tree", "content_size"], optional = true }

[features]
default = ["layout", "compiler"]
# The `.tj` lexer, parser, type-checker, compiler and built-in plugin sources.
# Leave it out (`--no-default-features`) for smaller AOT-only device builds that boot
# precompiled `.tjb` bundles from `tj build`.
compiler = []
# The flexbox layout engine, for native hosts. The web build leaves it out.
layout = ["dep:taffy"]
# Checks that only the command line runs (`tj check`, `dev`, `serve`): the personal-data
# flow check (flow.rs), about 60 KB that devices, which run apps the CLI checked, leave out.
check = ["compiler"]
# What only `tj serve` runs: exporting and erasing people, and the retention sweep. Devices
# leave it out.
server = []

[dev-dependencies]
# The core's own tests cover the checks and the server parts too.
tj-core = { path = ".", features = ["compiler", "check", "server"] }
