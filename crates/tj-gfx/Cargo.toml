[workspace]

[package]
name = "tj-gfx"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Asif Raja"]
description = "Optional wgpu 3D scene-graph renderer for tinyjump hosts (<Scene>, <Mesh>, <Camera>, <Light>)"
rust-version = "1.84"

[dependencies]
tj-core = { path = "../tj-core", default-features = false }
wgpu = "25"
pollster = "1"
serde_json = "1"

[dev-dependencies]
tj-core = { path = "../tj-core", features = ["compiler"] }
