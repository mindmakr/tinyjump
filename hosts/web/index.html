<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>tinyjump</title>
  <style>
    html, body { margin: 0; height: 100%; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { min-height: 100%; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { start } from './tinyjump.js';

    async function main() {
      const source = await (await fetch('app.tj', { cache: 'no-store' })).text();
      // The dev server is also the backend for `@server` objects.
      await start({ wasm: 'tinyjump.wasm', source, root: document.getElementById('app'), server: '', devOverlay: true });
      // Dev server: reload when the app source changes. Objects keep their state.
      if (window.EventSource) new EventSource('_tj/reload').addEventListener('reload', () => location.reload());
    }
    main();
  </script>
</body>
</html>
