# iOS host on the Simulator, plus the full test suite on macOS.
# Runs on pull requests to main and on demand. One job, about 10-15 minutes.
# The repository is public, so GitHub does not bill these macOS minutes.
name: apple

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apple-${{ hashFiles('Cargo.lock') }}

      - name: Tests on macOS
        run: cargo test --workspace

      - name: iOS device build
        run: |
          rustup target add aarch64-apple-ios
          cargo build -p tj-ffi --profile small --target aarch64-apple-ios

      - name: iOS app on the Simulator
        run: bash scripts/ios-sim.sh test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            target/ios-sim/*.png
            target/ios-sim/*.json
          if-no-files-found: ignore
